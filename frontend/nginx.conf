# Nginx config for the frontend container: serve the built SPA and proxy /api
# to the backend container ("api" resolves on the compose network).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Restores upload a whole database dump — allow large request bodies.
    client_max_body_size 2g;

    # API -> backend container
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # long backups/restores don't time out
        proxy_send_timeout 600s;
    }

    # Not every nginx build has .webmanifest in mime.types, and serving it as
    # octet-stream makes browsers grumble about the install manifest. Set the type
    # for just this one file — a nested `types { }` block would replace the whole
    # inherited map and break everything else.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # SPA — every other path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
